# Tells Bing (and other IndexNow search engines) which pages changed on each publish.
# Google does not use IndexNow; it reads sitemap.xml instead.
name: IndexNow
on:
  push:
    branches: [main]
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to publish the key file and pages
        run: sleep 90
      - name: Submit changed pages
        run: |
          KEY=6dffcb166a2184b2a9376c5573d62316
          HOST=picks.tracksideprofits.com
          git diff --name-only HEAD~1 HEAD -- '*.html' 2>/dev/null \
            | grep -v -E '^(p|e|pass)/|^fragment\.html$|^google' \
            | sed -E 's#index\.html$##; s#^#https://'"$HOST"'/#' | sort -u | head -9000 > urls.txt || true
          echo "https://$HOST/" >> urls.txt
          sort -u urls.txt -o urls.txt
          echo "Submitting $(wc -l < urls.txt) URLs"
          python3 - "$KEY" "$HOST" <<'EOF'
          import json, sys, urllib.request
          key, host = sys.argv[1], sys.argv[2]
          urls = [u.strip() for u in open("urls.txt") if u.strip()]
          body = json.dumps({"host": host, "key": key, "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              print("IndexNow response:", urllib.request.urlopen(req, timeout=30).status)
          except urllib.error.HTTPError as err:
              print("IndexNow response:", err.code, err.read()[:300])
          EOF
